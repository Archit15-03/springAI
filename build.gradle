plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'spring.ai.demo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }

}

ext {
	set('springAiVersion', "2.0.0-M8")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
//	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	//required for git clone
	implementation 'org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r'
	// tree sitter
//	implementation 'io.github.bonede:tree-sitter:0.20.8'
//	implementation 'io.github.bonede:tree-sitter-java:0.20.2'
//	implementation 'io.github.bonede:tree-sitter-javascript:0.20.1'
//	implementation 'io.github.bonede:tree-sitter-python:0.20.2'
//	implementation 'io.github.bonede:tree-sitter-typescript:0.20.1'
//	implementation 'io.github.bonede:tree-sitter-go:0.20.0'
//	implementation 'io.github.bonede:tree-sitter-rust:0.20.0'

// ── tree-sitter core ─────────────────────────────────────────
	implementation 'io.github.bonede:tree-sitter:0.26.6'

// ── Language grammars — exact versions from Maven Central ────
	implementation 'io.github.bonede:tree-sitter-java:0.23.5'
	implementation 'io.github.bonede:tree-sitter-javascript:0.25.0'
	implementation 'io.github.bonede:tree-sitter-typescript:0.23.2'
	implementation 'io.github.bonede:tree-sitter-python:0.25.0'
	implementation 'io.github.bonede:tree-sitter-go:0.25.0'
	implementation 'io.github.bonede:tree-sitter-rust:0.24.0'


}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
